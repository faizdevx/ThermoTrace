# Public read-only demo on one VM:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# See docs/DEPLOY.md. Only Caddy (80/443) is published; the database, API and worker stay on the internal network.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_started }

  db:
    ports: !reset []
    logging: &logs
      driver: json-file
      options: { max-size: "20m", max-file: "10" }       # request logs (stdout of api) and the rest rotate instead of filling the disk
  api:
    logging: *logs
    ports: !reset []
    environment:
      # public read-only demo by default; for a real deployment set DEMO_READONLY=false AUTH_MODE=local (docs/SECURITY.md)
      DEMO_READONLY: ${DEMO_READONLY:-true}          # true: every POST/PATCH/DELETE answers 403, whatever tokens are sent
      ANALYST_TOKEN: ""
      ADMIN_TOKEN: ""
      TRUSTED_PROXY_HOPS: "2"                        # caddy -> nginx -> api: the client address is two entries from the right of X-Forwarded-For
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
  frontend:
    ports: !reset []
  thermal:
    # the 365-day baseline travels as a parquet file in the demo bundle (the database view needs 1.9 M archived detections)
    environment:
      THERMAL_BASELINE_DIR: /data/baseline
    volumes:
      - ./demo-bundle/baseline:/data/baseline:ro

volumes:
  caddy_data:
  caddy_config:
