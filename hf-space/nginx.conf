# nginx for the single-container Space: runs as the unprivileged Space user, listens on 7860, everything writable under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    access_log off;
    gzip on;
    gzip_types application/json application/javascript text/css application/geo+json;

    limit_req_zone $binary_remote_addr zone=api_all:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=6r/m;
    limit_req_status 429;

    server {
        listen 7860;
        root /srv/www;
        index index.html;

        location ~ ^/api/(thermal/sources/[^/]+/imagery|alerts/[0-9]+/report\.pdf)$ {
            limit_req zone=api_heavy burst=4 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api_all burst=60 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
