# Industry Taxonomy Configuration
# =================================
# Maps raw industry type values into a controlled set of normalized categories.
#
# Structure
# ---------
# Each entry under `categories` defines a normalized category with:
#   - code:    The normalized output value (uppercase, stable across refreshes)
#   - label:   Human-readable label
#   - aliases: List of raw strings that map to this category
#             (case-insensitive, substring matching is NOT used — aliases must
#              be complete values or close variations; use explicit entries)
#
# Fallback
# --------
# Values that match no alias are assigned the code from `fallback_category`.
# Set `fallback_category: OTHER` (recommended) so unrecognized values are
# preserved as OTHER rather than being silently NULL.
#
# OSM tags
# --------
# The `osm_tags` list under each category maps OSM tag values (e.g.
# "landuse=industrial", "craft=pottery") to this category.  These are matched
# against the `industrial_type` column produced by normalize_industrial_type().
#
# Extending this taxonomy
# -----------------------
# To add a new category:
#   1. Add a new entry under `categories` with a unique `code`.
#   2. Add `aliases` for all raw values you want mapped to it.
#   3. Re-run the pipeline — normalization is applied at ingestion time.
# Existing codes must NEVER be changed (they are written to the database).

fallback_category: "OTHER"

