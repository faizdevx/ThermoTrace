services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: industrial-data-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial_data}
      POSTGRES_USER: ${POSTGRES_USER:-industrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industrial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-industrial} -d ${POSTGRES_DB:-industrial_data}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data: