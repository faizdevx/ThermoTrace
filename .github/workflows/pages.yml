# Public live site on GitHub Pages, no server: the runner loads the saved state into PostGIS, runs one real FIRMS cycle (fetch,
# classify, alerts), saves the state back to the pages-state branch, asks the real API for every view and publishes those answers
# with the static build of the app (VITE_STATIC_DATA=1). docs/DEPLOY_PAGES.md
#
# Three jobs so that third-party code never holds a write token: `build` installs PyPI/npm packages with a read-only token;
# `save-state` (contents: write) and `deploy` (pages: write) run only GitHub's own actions and git. Actions are pinned by commit.
name: Live site (GitHub Pages)

on:
  schedule:
    - cron: "7,27,47 * * * *"     # off the hour: scheduled runs at :00 are the most delayed
  workflow_dispatch:              # cron-job.org calls this every 15 minutes (GitHub's own schedule is unreliable)
  push:
    branches: [main]           # republish when the app or pipeline changes
    paths-ignore: ["docs/**", "**.md"]

permissions: {}

concurrency:
  group: live-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      cycle: ${{ steps.cycle.outcome }}
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: live, POSTGRES_USER: thermotrace, POSTGRES_DB: thermotrace }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thermotrace" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://thermotrace:live@localhost:5432/thermotrace
      PYTHONPATH: ${{ github.workspace }}/industrial-gis:${{ github.workspace }}/industrial-data
      DATA_MODE: postgis
      DEMO_READONLY: "true"
      THERMAL_DATA_DIR: ${{ github.workspace }}/run/live
      THERMAL_BASELINE_DIR: ${{ github.workspace }}/run/baseline
      THERMAL_SITES_FROM_DB: "1"
      THERMAL_IMAGERY: "false"     # no on-demand imagery on a static site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: pages-state, path: state, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "industrial-data/requirements.txt" }
      - run: pip install -r industrial-data/requirements.txt -r industrial-gis/backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: industrial-gis/frontend/package-lock.json }

      - name: Schema and saved state
        run: |
          (cd industrial-data && python -m src.sync.cli migrate)
          python deploy/pages/state.py load state

      - name: One FIRMS cycle
        id: cycle
        continue-on-error: true    # FIRMS down: publish the last state, the status shows how old it is
        working-directory: industrial-data
        env: { FIRMS_MAP_KEY: "${{ secrets.FIRMS_MAP_KEY }}" }
        run: python -m src.thermal.cli refresh

      - name: Updated state
        if: steps.cycle.outcome == 'success'
        run: python deploy/pages/state.py save state && rm -rf state/.git
      - if: steps.cycle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pages-state, path: state, retention-days: 1, include-hidden-files: false }

      - name: API answers to files
        run: |
          (cd industrial-gis && uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health >/dev/null && break; sleep 2; done
          python deploy/pages/crawl.py site-data || { cat api.log; exit 1; }

      - name: Static build
        working-directory: industrial-gis/frontend
        env: { VITE_STATIC_DATA: "1", REPO_NAME: "${{ github.event.repository.name }}" }
        run: |
          npm ci
          npx vite build --base="/$REPO_NAME/" --outDir ../../site
          cp -r ../../site-data ../../site/data
          touch ../../site/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site }

  save-state:
    needs: build
    if: needs.build.outputs.cycle == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write              # only this job can push, and it runs no installed packages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: pages-state, path: state }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: pages-state, path: new }
      - name: Push the new state (one commit, no history)
        run: |
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan next
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../new/. .
          git add -A
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q --force origin next:pages-state

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
