# Per-client rate limits (the public demo): a normal page makes a handful of requests; imagery and PDF reports trigger
# 20-30 s of work, so they get a tight budget.
limit_req_zone $binary_remote_addr zone=api_all:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; with a variable in proxy_pass nginx re-resolves "api" (valid 10 s) instead of
    # caching the container IP forever - recreating the api container used to leave the web UI on 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API + Server-Sent Events. Buffering must be off or SSE messages are held back.
    # expensive on-demand work: Sentinel-2 / Landsat chips and PDF reports
    location ~ ^/api/(thermal/sources/[^/]+/imagery|alerts/[0-9]+/report\.pdf)$ {
        limit_req zone=api_heavy burst=4 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_all burst=60 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
